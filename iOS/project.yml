name: ParkingSpotFinder
options:
  bundleIdPrefix: com.shimondeitel.parkspot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  ParkingSpotFinder:
    type: application
    platform: iOS
    sources:
      - path: ParkingSpotFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.parkspot
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ParkingSpotFinder/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ParkingSpotFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkingSpotFinderTests
      - path: ParkingSpotFinder.storekit
    dependencies:
      - target: ParkingSpotFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.parkspot.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ParkingSpotFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkingSpotFinderUITests
    dependencies:
      - target: ParkingSpotFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.parkspot.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ParkingSpotFinder:
    build:
      targets:
        ParkingSpotFinder: all
        ParkingSpotFinderTests: [test]
        ParkingSpotFinderUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ParkingSpotFinder.storekit
    test:
      config: Debug
      storeKitConfiguration: ParkingSpotFinder.storekit
      targets:
        - ParkingSpotFinderTests
        - ParkingSpotFinderUITests
    archive:
      config: Release
